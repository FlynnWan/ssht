name: Release macOS ARM64

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match VERSION)'
        required: true
        default: 'v0.0.1'

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(cat VERSION)"
          echo "SSHT_VERSION=$version" >> "$GITHUB_ENV"
          swift --version
      - name: Run tests
        run: ./scripts/test.sh
      - name: Build ARM64 application
        run: ./scripts/build.sh
      - name: Package and verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(lipo -archs dist/SSHT.app/Contents/MacOS/SSHT)" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/SSHT.app/Contents/Info.plist)" = "$SSHT_VERSION"
          codesign --verify --deep --strict dist/SSHT.app
          mkdir -p dist/releases
          ditto -c -k --sequesterRsrc --keepParent dist/SSHT.app "dist/releases/SSHT-${RELEASE_TAG}-macos-arm64.zip"
          cd dist/releases
          shasum -a 256 "SSHT-${RELEASE_TAG}-macos-arm64.zip" > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              target=(--verify-tag)
            else
              target=(--target "$GITHUB_SHA")
            fi
            gh release create "$tag" "${target[@]}" --title "SSHT $tag" --notes-file docs/release-notes.md --draft
          fi
          gh release upload "$tag" "dist/releases/SSHT-${tag}-macos-arm64.zip" dist/releases/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --latest
